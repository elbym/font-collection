content: |
  Intel One Mono entstand 2023 bei Frere-Jones Type im Auftrag von Intel, gezielt für sehbehinderte Entwicklerinnen und Entwickler: Ein Panel aus Programmierern mit Sehbehinderung oder gesetzlicher Blindheit gab in jeder Entwurfsphase Rückmeldung. Offene Formen, klar unterscheidbare Zeichen und eine echte Kursive in vier Gewichten sollen Ermüdung und Lesefehler verringern. Die Webfonts sind laut Projekt für die Bildschirmdarstellung von Hand optimiert.
