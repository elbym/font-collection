content: |
  Geist Mono ist Vercels proprietäre Coding-Schrift, 2023 als Open-Source-Version veröffentlicht. Als Gegenstück zur serifenlosen Geist-Textschrift teilt sie deren klare, funktionale Linienführung — optimiert für Terminals, Code-Editoren und Entwickler-Interfaces. Die Verwandtschaft zu Shannon Hagemans Designs und Vercels eigener Designsprache ist spürbar.
