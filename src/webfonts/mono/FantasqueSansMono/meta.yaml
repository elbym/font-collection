content: |
  Fantasque Sans Mono von Jany Belluz ist eine Programmierschrift mit leicht handschriftlichem, wackeligem Charakter. Sie hieß zuerst „Cosmic Sans Neue Mono“, weil sie für ihren Autor zeitweise wie ein Kind aus Comic Sans und Helvetica Neue aussah. Vorbilder waren Inconsolata, Monaco und Consolas. Die Kursive ist echt gezeichnet und fast schon eine Schreibschrift, mit geschwungenen Formen bei f, k und z.
