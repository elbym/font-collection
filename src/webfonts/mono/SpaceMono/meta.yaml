content: |
  Space Mono entwarf Colophon Foundry 2016 für Google Design als Monospace-Schrift für Überschriften und Display-Typografie, nicht in erster Linie für Code. Ein geometrischer Kern mit Anklängen an Slab-Serifen trifft auf bewusst „überrationalisierte“ Formen; das wirkt retro-futuristisch. Schon die aufrechte Form hat ein einstöckiges a, die Kursive ist echt gezeichnet, mit f mit Unterlänge und geschwungenem l.
