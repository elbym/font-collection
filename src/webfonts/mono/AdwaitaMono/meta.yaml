content: |
  Adwaita Mono ist seit GNOME 48 (2025) die Standard-Monospace-Schrift des GNOME-Desktops und löste dort Source Code Pro ab. Sie ist kein Neuentwurf, sondern eine eigene Iosevka-Konfiguration, die auf die neue UI-Schrift Adwaita Sans (eine Variante von Inter) abgestimmt ist: etwas breiter und ruhiger als Iosevka, mit echter Kursive. Die Dateien hier stammen aus Release 51.0 und sind auf lateinische Zeichen reduziert.
