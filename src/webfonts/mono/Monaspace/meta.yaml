content: |
  Monaspace ist GitHubs Coding-Mono-Superfamilie mit fünf unterschiedlichen Texturen: Neon (Neo-Grotesk), Argon (Humanist), Xenon (Slab), Radon (Handwriting) und Krypton (Mechanisch). Alle fünf teilen identische Metrik, sind also austauschbar und kombinierbar — ein Konzept, das es so bei Monospace-Schriften bisher nicht gab. Variable-Font-Achsen decken Gewicht und kursive Varianten ab.
