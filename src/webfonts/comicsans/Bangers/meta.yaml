content: |
  Bangers von Vernon Adams ist eine Comic-Titelschrift im Stil der Lettering-Schriften aus Superhelden-Heften der Mitte des 20. Jahrhunderts: nur Versalien, kräftig, schräg gestellt und eng gesetzt. Gemacht für Ausrufe, Titel und Sprechblasen, nicht für Fließtext.
