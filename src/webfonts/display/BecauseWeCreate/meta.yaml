title: Because We Create
url: https://github.com/RedHatOfficial/bwht-fonts

tags: Display, Handwriting

fontauthor: Russ McMullin, Liz Wetzel, Aaron Williamson
fontyear: 2019

heroletter: Cr
heroword: Create
herostyle:
color: mediumvioletred

content: |
  Because We Create ist eine von sechs handgeschriebenen Display-Schriften aus Red Hats redaktionellem Projekt "Because We Had To". Die Formen stammen aus echter Handschrift von Kolleginnen und wurden mit OpenType-Features versehen, die den Zeilenfluss leicht randomisieren und so eine organische, unregelmäßige Anmutung erzeugen. Gedacht für großformatige Headlines statt Fließtext.
