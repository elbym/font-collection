title: Silkscreen
url: https://fonts.google.com/specimen/Silkscreen

tags: Display, Monospace

fontauthor: Jason Kottke
fontyear: 2001

heroletter: Ss
heroword: "PIXEL"
color: lime

content: |
  Silkscreen von Jason Kottke ist eine saubere, für UI-Einsatz konzipierte Pixel-Schrift — bewusst so gestaltet, dass sie auch in kleinen Größen auf Bildschirmen gut lesbar bleibt. Gemeinsam mit Departure Mono eröffnet sie die Pixel- und Retro-Ästhetik als eigenständige typografische Kategorie in der Sammlung.
