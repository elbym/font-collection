content: |
  Saira Stencil One von Héctor Gatti ist ein fettes, kühnes Stencil-Display-System, das sich durch breite, gerundete Formen auszeichnet. Als Sonderausgabe der großen Saira-Superfamilie bietet sie eine unverwechselbare Präsenz mit perforierten Buchstaben, die Kraft und Eleganz ausstrahlen. Die Familie hat nur diesen einen Schnitt — gedacht für Plakate und Beschilderung, nicht für Lauftext.
