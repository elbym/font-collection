content: |
  VT323 basiert auf der Bildschirmschrift des DEC-Terminals VT320 aus den späten 1980ern. Die schmale Monospace-Pixelschrift ist erstaunlich gut lesbar und bringt den Charme grün leuchtender Röhrenmonitore zurück.
