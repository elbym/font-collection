content: |
  Press Start 2P bildet die Schriften der Namco-Arcade-Automaten der 1980er nach: ein 8×8-Pixelraster, breit und blockig. Wie alle Pixelschriften wirkt sie nur in ganzzahligen Vielfachen ihrer Rastergröße wirklich scharf.
