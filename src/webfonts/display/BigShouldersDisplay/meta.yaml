title: Big Shoulders Display
url: https://fonts.google.com/specimen/Big+Shoulders+Display

tags: Display, Condensed, Variable

fontauthor: Patric King
fontyear: 2019

heroletter: Bs
heroword: "BIG"
herostyle: bold
color: darkslateblue

content: |
  Big Shoulders Display von Patric King ist ein schmal-kondensierter Industrial-Grotesque, der sich auf die Plakatschriften der Chicagoer Industrieepoche bezieht — kräftig, raumgreifend, unmissverständlich. Die Variable Font deckt ein breites Gewichtsspektrum ab; im Bold ein echtes Ausrufungszeichen für Headline-Typografie. Stark im Zusammenspiel mit konträren, leichten Seriftextschriften.
