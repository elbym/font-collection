title: Display

content: |
  Display-Schriften sind auf maximale visuelle Wirkung in großen Größen ausgelegt — Headlines, Plakate, Logos. Was sie eint: Eigencharakter vor Lesbarkeit im Fließtext.

  Die Kategorie umfasst kondensierte Grotesken, Pixel-Schriften, expressive Geometrische und kulturell geprägte Formen. Gemeinsam haben sie, dass ihre Persönlichkeit das Thema ist.
