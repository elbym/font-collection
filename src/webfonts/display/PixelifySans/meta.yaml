title: Pixelify Sans
url: https://github.com/eifetx/Pixelify-Sans

tags: Display, Pixel, Bitmap, Variable

fontauthor: Eife Xu
fontyear: 2023

heroletter: Pp
heroword: PIXEL
color: slateblue

content: |
  Pixelify Sans ist eine proportionale Pixel-Schrift mit echter Gewichtsachse – ungewöhnlich für das Genre, da Bitmap-Fonts normalerweise nur einen festen Schnitt pro Größe haben. Die wght-Achse reicht von 400 bis 700, also von Regular bis Bold. Pixelfonts wirken authentisch nur bei ihrer Designgröße und ganzzahligen Vielfachen davon, was bei dieser Schrift den pixelartigen Charakter bewahrt.
