content: |
  Syne entstand als Identitätsschrift der Kunsthochschule HEAR in Straßburg und trägt diesen experimentellen Geist noch heute. Die Schnitte reichen von einem konservativen Text-Grotesque bis zu stark verfremdeten Display-Varianten mit offenen Gegenformen — eine Schrift, die bewusst das Spektrum zwischen Nützlichkeit und Überraschung auslotet.
