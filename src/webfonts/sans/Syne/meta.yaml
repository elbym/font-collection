content: |
  Syne wurde ursprünglich für die Kunsthochschule Villa Arson in Nizza entworfen und verbindet geometrische Strenge mit einem bewusst eigenartigen, expressiven Charakter. Die Schriftfamilie umfasst mehrere stark unterschiedliche Schnitte — von ultraweitem Display bis zu einer dezidiert monospacierten Mono-Variante. Persönlichkeit zwischen Raleway und Epilogue, mit eigenem institutionellen Kontext.
