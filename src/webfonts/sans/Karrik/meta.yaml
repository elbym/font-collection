title: Karrik
url: https://velvetyne.fr/fonts/karrik/

tags: Sans, Grotesk, Reverse Contrast

fontauthor: Jean-Baptiste Morizot, Lucas Le Bihan
fontyear: 2019

heroletter: Kk
heroword: Grotesk
color: orangered

content: |
  Karrik ist eine Reverse-Contrast-Grotesk, entstanden aus bewusst zusammengesammelten, inkongruenten Letterformen – ein Groteskschriftsatz, der seinen eigenen "bereits benutzt" Status zur Gestaltungsaussage macht. Aufgebaut aus gefundenen Elementen unterschiedlichster Herkunft, präsentiert sich die Schrift als freche Montage ungleicher Teile. Umgekehrter Strichkontrast – die Waagerechten sind kräftiger als die Senkrechten, genau andersherum als gewohnt – fehlte in dieser Sammlung bisher völlig; nur Fraunces berührt die Idee ansatzweise. Jean-Baptiste Morizot und Lucas Le Bihan haben mit Karrik eine Schrift geschaffen, die Typografie als Material-Recycling denkt.
