content: |
  Fira Sans wurde 2013 von Erik Spiekermann und Ralph du Carrois im Auftrag von Mozilla und Telefónica entworfen, ursprünglich als Systemschrift für Firefox OS. Die humanistische Groteskschrift spiegelt Spiekermanns Handschrift wider, erinnert stark an seine FF Meta und verbindet technische Präzision mit warmem, lesbarem Charakter.
