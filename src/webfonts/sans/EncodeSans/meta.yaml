title: Encode Sans
url: https://fonts.google.com/specimen/Encode+Sans

tags: Sans, Condensed, Variable

fontauthor: Pablo Impallari
fontyear: 2015

heroletter: Es
heroword: "Encode"
color: darkslategray

content: |
  Encode Sans von Pablo Impallari ist eine variable Grotesque-Familie mit breitem Spektrum von Condensed bis Expanded. Die Schrift wurde explizit für die Variable-Font-Technologie entworfen und deckt damit viele typografische Situationen mit einer einzigen Datei ab. Solide Handwerksarbeit ohne ausgeprägte Designpersönlichkeit — zuverlässiges Werkzeug.
