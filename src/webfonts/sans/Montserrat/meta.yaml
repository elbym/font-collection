content: |
  Montserrat entstand 2011 aus Julieta Ulanovskys Beobachtung der Beschriftungen im Buenos Aires Stadtviertel Montserrat: Straßenschilder, Plakate und Ladenschilder aus der ersten Hälfte des 20. Jahrhunderts. Die geometrische Groteskschrift wurde seither von einem Team um Ulanovsky stark erweitert und ist heute als Variable Font mit Gewichtsachse samt Kursiv unter der OFL verfügbar.
