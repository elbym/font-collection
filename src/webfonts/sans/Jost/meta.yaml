content: |
  Jost* von Owen Earl ist eine moderne Adaption des Futura-Prinzips: geometrische Grundformen und konstruktive Schlichtheit, aber mit zeitgemäßen Proportionen und verbesserter Bildschirmlesbarkeit. Der Stern im Namen verweist auf die bewussten Abweichungen vom historischen Vorbild und den Anspruch, eine eigenständige Weiterentwicklung zu sein.
