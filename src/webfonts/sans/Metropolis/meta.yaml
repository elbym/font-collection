content: |
  Metropolis ist eine geometrische Groteskschrift, die sich stark am Gotham-Stil orientiert, der durch Barack Obamas Wahlkampf 2008 Weltruhm erlangte. Das Open-Source-Projekt von Chris Simpson stellt eine frei zugängliche Alternative dar, die denselben modernen, selbstbewussten Charakter vermittelt.
