content: |
  Junction von Caroline Hadilaksono und Tyler Finck, veröffentlicht von The League of Moveable Type, verbindet die geometrische Struktur einer Groteskschrift mit der humanistischen Wärme klassischer Buchstabenentwürfe. Sie ist als vielseitige, offene Alternative für Textsatz und Interface-Nutzung konzipiert.
