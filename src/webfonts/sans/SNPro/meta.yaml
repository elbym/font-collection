content: |
  SN Pro ist eine freundliche Groteskschrift, die Supernotes für Markdown-Texte entwickelt hat. Sie basiert auf Nunito von Vernon Adams; jedes Zeichen wurde überarbeitet, damit Auszeichnungssymbole wie Sternchen, Rauten und Klammern im Fließtext gut lesbar bleiben. Die Familie ist als Variable Font mit Gewichts- und Kursivachse unter der OFL erhältlich.
