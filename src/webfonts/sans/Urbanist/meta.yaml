title: Urbanist
url: https://fonts.google.com/specimen/Urbanist

tags: Sans, Geometric, Grotesk

fontauthor: Corey Hu
fontyear: 2020

heroletter: Uu
heroword: "Urban"
color: darkgray

content: |
  Urbanist von Corey Hu ist ein minimalistisch-geometrischer Sans mit starker Neutralität — cleaner als Jost, wärmer als Inter. Die variablen Gewichte und die weite Laufweite machen ihn zu einer zuverlässigen Wahl für moderne UI-Projekte, bei denen die Schrift keine Aufmerksamkeit auf sich ziehen soll. Schließt eine deutliche Lücke im Bestand zwischen den beiden Referenzen.
