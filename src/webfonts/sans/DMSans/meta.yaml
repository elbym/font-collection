content: |
  DM Sans ist eine Groteskschrift mit geometrischem Charakter, die Colophon Foundry im Auftrag von MultiAdaptor aus Jonny Pinhorns Poppins ableitete. Die Variante für Google Fonts ist als Variable Font mit Gewichts- und optischer Größenachse (9–40 pt) erhältlich: Kleine Größen bekommen weitere Abstände und größere Gegenformen, große Größen werden enger und straffer.
