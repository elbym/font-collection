title: Mulish
url: https://github.com/googlefonts/mulish

tags: Sans, Variable

fontauthor: Vernon Adams, Cyreal, Jacques Le Bailly
fontyear: 2011

heroletter: Aa
heroword: "Klar"
color: sienna

content: |
  Mulish ist eine minimalistische Grotesk von Vernon Adams, die 2011 unter dem Namen Muli bei Google Fonts erschien und später von Cyreal und Jacques Le Bailly ausgebaut wurde. Die variable Familie reicht von ExtraLight bis Black, jeweils mit Kursive, und eignet sich für Überschriften wie für Fließtext.
