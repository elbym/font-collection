title: Nunito
url: https://github.com/googlefonts/nunito

tags: Sans, Rounded, Variable

fontauthor: Vernon Adams, Cyreal, Jacques Le Bailly
fontyear: 2011

heroletter: Nn
heroword: "Warm"
color: lightseagreen

content: |
  Nunito ist eine klassische Rundungs-Sans mit weichen, abgerundeten Terminals – ursprünglich als Display-Schrift konzipiert und später zu einer vielseitigen Text-Familie ausgebaut. Mit variabler Gewichtsskala bietet sie von zarten bis kräftigen Gewichten eine freundliche, zugängliche Typografie für alle Größen. In dieser Sammlung ist sie die erste echte Rundschrift unter 33 Serifenlosen — Figtree ist nur leicht abgerundet.
