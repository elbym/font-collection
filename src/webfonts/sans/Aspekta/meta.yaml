content: |
  Aspekta ist eine freie Sans-Serif des kroatischen Designers Ivo Dolenc, erstmals 2022 veröffentlicht. Sie folgt einem klaren, schlichten und neutralen Stil und bietet zwanzig Gewichte von 50 bis 1000 sowie vierzehn Stylistic Sets für alternative Formen.
