title: Oswald
url: https://fonts.google.com/specimen/Oswald

tags: Sans, Condensed, Display

fontauthor: Vernon Adams
fontyear: 2011

heroletter: Oo
heroword: "OSWALD"
herostyle: bold
color: steelblue

content: |
  Oswald von Vernon Adams ist eine kondensierte Neuinterpretation klassischer Plakat- und Zeitungsschriften des frühen 20. Jahrhunderts, optimiert für digitale Bildschirme. Mit variabler Gewichtsskala und ungewöhnlich hoher Erkennbarkeit gehört sie zu den meistgenutzten Display-Schriften im Web — als Referenz in dieser Kategorie nicht zu ignorieren.
