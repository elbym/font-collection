heroletter: Aa
heroword: Elegant
color: mediumpurple
border: lines_thin.svg

content: |
  Raleway entstand ursprünglich als ein einziger Thin-Schnitt von Matt McInerney und wurde 2013 durch Pablo Impallari zur vollständigen Schriftfamilie ausgebaut. Die geometrische Sans mit eleganten Proportionen und dem charakteristischen schmalen W eignet sich besonders für hochwertige Display-Typografie, Mode und Corporate Design.
