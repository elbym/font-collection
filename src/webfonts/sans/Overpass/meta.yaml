content: |
  Overpass wurde von Dave Crossland in Anlehnung an Highway Gothic entworfen, die Schrift auf amerikanischen Straßenschildern und Autobahnmarkierungen. Von Red Hat als Open Source gepflegt, verbindet sie die sachliche Lesbarkeit eines Leitsystemfonts mit zeitgemäßen OpenType-Features.
