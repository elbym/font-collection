title: Vazirmatn
url: https://github.com/rastikerdar/vazirmatn
tags: Sans, Arabisch, Variable

fontauthor: Saber Rastikerdar
fontyear: 2015

heroletter: Vv
heroword: "Vazir"
color: darkcyan

content: |
  Vazirmatn ist eine der ersten Schriften dieser Sammlung mit einem nicht-lateinischen Schriftsystem und deckt Arabisch und Persisch ab. Das variable Schriftsystem (wght-Achse) ermöglicht feinere Gewichtskalibrierung als feste Schnitte und wurde speziell für digitale Anwendungen entwickelt. Die lateinischen Glyphen werden von der Roboto-Schrift abgeleitet, was eine konsistente und lesbare Mischung aus den beiden Schriftsystemen gewährleistet. Die Abdeckungsanzeige auf dieser Seite zeigt nur lateinische Unicode-Bereiche, daher werden die arabischen und persischen Zeichenbereiche dort nicht reflektiert.
