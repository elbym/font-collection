content: |
  League Spartan ist eine kräftige geometrische Groteskschrift der League of Moveable Type, beeinflusst von Futura Heavy und dem Weimarer Konstruktivismus. Ihre ausgeprägte Geometrie und starke Optik eignen sich hervorragend für Überschriften, Logos und plakativen Display-Einsatz.
