content: |
  Figtree von Erik D. Kennedy ist ein geometrisch-gerundeter Sans mit freundlichem Tonfall und variabler Gewichtsskala. Im Gegensatz zu Nunito wirkt sie schlanker und moderner, ohne die weiche Wärme aufzugeben. Für Projekte, die Zugänglichkeit und Eleganz gleichzeitig suchen, ist Figtree eine überzeugende Alternative zu den üblichen Rundungs-Sans.
