content: |
  Plus Jakarta Sans von Gumpita Rahayu ist ein geometrischer Grotesque mit leichter Wärme in den Kurven — entstanden als Display-optimierte Weiterentwicklung der originalen Jakarta Sans. Die Großbuchstaben folgen klassischer geometrischer Tradition; die Kleinbuchstaben zeigen mehr humanistische Neigung. Variable Font von Regular bis ExtraBold.
