content: |
  Lexend entstand aus einem Forschungsprojekt zur Lesbarkeitsoptimierung: Bonnie Shaver-Troup entwickelte die Schrift auf Basis von Studien, die zeigten, dass Buchstabenabstand und -form die Leseflüssigkeit — besonders bei Leseschwäche — messbar beeinflussen. Die variable Achse steuert den Buchstabenabstand als primären Lesbarkeitsparameter.
