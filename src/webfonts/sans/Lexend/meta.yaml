content: |
  Lexend entstand aus einem Forschungsprojekt zur Lesbarkeit für Menschen mit Leseschwäche. Thomas Jockin entwickelte die Schrift auf Basis von Studien zu Buchstabenabstand, x-Höhe und Formklarheit. Sie ist die einzige dezidierte Accessibility-Schrift in der Sammlung und repräsentiert einen konzeptionell anderen Ausgangspunkt als ästhetisch motivierte Schriftentwicklung.
