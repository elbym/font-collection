fontauthor: Astigmatic
fontyear: 2011

heroletter: Aa
heroword: Unziale

content: |
  Uncial Antiqua von Astigmatic greift die Unziale auf, die Buchschrift frühmittelalterlicher Handschriften wie dem Book of Kells. Gerundete Formen ohne Unterscheidung von Groß- und Kleinbuchstaben geben ihr einen keltisch-mittelalterlichen Charakter. Streng genommen keine gebrochene Schrift, aber ihre Vorläuferin.
