title: Grenze Gotisch
url: https://www.omnibus-type.com/fonts/grenze-gotisch/

tags: Blackletter, Display, Script, Serif

comment: "Identisch mit Grenze, aber mit ein paar dramatischen Details."

fontauthor: Renata Polastri & Omnibus-Type Team
fontyear: 2020

heroletter: Aa
heroword: Gothic
herostyle:
color: mediumslateblue

content: |
  Grenze Gotisch teilt die DNA mit ihrer Schwester Grenze, treibt jedoch die gotischen Formen ins Dramatische: Spitze Bögen, ausgeprägte Kontraste und kalligrafische Schwünge verleihen ihr eine dunklere, expressivere Atmosphäre. Ideal für Plakate, Band-Logos oder alle Projekte, bei denen der Blackletter-Stil im Vordergrund stehen soll.
