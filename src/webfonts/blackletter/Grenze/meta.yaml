content: |
  Grenze verbindet die dekorative Schwere des Blackletter mit modernen Serifen- und Slab-Elementen. Die 2020 vom argentinischen Studio Omnibus-Type veröffentlichte Schrift eignet sich für markante Überschriften und Display-Einsätze, bei denen ein gotischer Charakter ohne historische Strenge gefragt ist.
