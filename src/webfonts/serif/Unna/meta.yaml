content: |
  Unna von Jorge de Buen und Omnibus-Type ist eine elegante Didone-Serifenschrift mit markanten vertikalen Stressachsen und zartem Haarstrich. Die für den Web-Einsatz optimierte Schrift basiert auf den klassischen Prinzipien von Firmin Didot und Giambattista Bodoni und eignet sich für Display-Anwendungen und Fließtext gleichermaßen.
