content: |
  IM Fell English ist Igino Marinis digitale Nachbildung der Drucktypen, die Bischof John Fell im 17. Jahrhundert für die Oxford University Press sammelte. Marini hat die Unregelmäßigkeiten des Bleisatzes bewusst erhalten, sodass Texte wie aus einem alten Buch gedruckt wirken. Es gibt keinen fetten Schnitt.
