content: |
  Tex Gyre Schola entspricht der Century Schoolbook, die Morris Fuller Benton 1919 für die American Type Founders entwarf. Century Schoolbook wurde speziell für Schulbücher konzipiert – besonders gut voneinander unterscheidbare Buchstaben und hoher Kontrast sollten jungen Leserinnen und Lesern zugutekommen.
