content: |
  DM Serif Display ist die hochkontrastige Auszeichnungsvariante der DM-Serif-Familie. Colophon Foundry überarbeitete Frank Grießhammers Source Serif für große Größen: Haarlinien und Serifen sind feiner, die Kontraste schärfer. Für Überschriften und Plakate gedacht, nicht für Fließtext.
