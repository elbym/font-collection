content: |
  Instrument Serif von Rodrigo Fuenzalida ist das Serif-Gegenstück zur gleichnamigen Sans — ein transitional anmutender Serif für Editorial- und Interface-Einsatz. Die Schrift zeichnet sich durch moderate Strichstärkenvariation, klare Serifen und gute Lesbarkeit in mittleren Graden aus. Gutes Paar mit Instrument Sans für konsistente Design-Systeme.
