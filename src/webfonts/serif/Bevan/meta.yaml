title: Bevan
url: https://github.com/googlefonts/BevanFont

tags: Serif, Slab Serif, Display

fontauthor: Vernon Adams
fontyear: 2011

heroletter: Bb
heroword: Poster
color: tomato

content: |
  Bevan ist ein kräftiger ägyptischer Slab Serif für monumentale Überschriften und Plakate. Die gleichmäßig kräftigen, ungekehlten Serifen und die engen Innenräume geben ihr eine gedrängte, präsente Wirkung. Sie ergänzt die Collection um eine wirklich schwergewichtige Slab Serif – wo Bitter für Fließtext optimiert ist, dominiert Bevan als reine Display-Schrift.
