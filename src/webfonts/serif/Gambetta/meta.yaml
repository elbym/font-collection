content: |
  Gambetta von der Indian Type Foundry ist ein hochkontrastreicher Display-Serif mit eleganten, feinen Haarlinien und kräftigen Grundstrichen — Didone-Tradition trifft zeitgemäßes Design. Für Magazine-Headlines und Editorial-Typografie konzipiert, wirkt die Schrift am stärksten in großen Graden. Variable Font via Fontshare, kostenlos für kommerzielle Nutzung.
