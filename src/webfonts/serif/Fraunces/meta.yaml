content: |
  Slow-source Display-Schrift mit vier Variationsachsen: Gewicht,
  optische Größe, Weichheit (Wonky) und Slant. Variable Font — die
  Wonky-Achse erzeugt absichtlich unregelmäßige, handgemachte Formen.
