content: |
  Fraunces, entworfen von Undercase Type (Phaedra Charles und Flavia Zimbardi), ist eine 2020 erschienene Variableschrift mit vier Achsen: Gewicht, Optische Größe, Wonkiness und Kursiv. Besonders die Wonk-Achse ist ungewöhnlich – sie steuert die Exzentrizität einzelner Letterformen und macht Fraunces zu einer der charakterstärksten Open-Source-Displayschriften.
