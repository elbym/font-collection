content: |
  DM Serif Text ist die Textvariante der DM-Serif-Familie, entstanden bei Colophon Foundry im Auftrag von MultiAdaptor auf Grundlage von Frank Grießhammers Source Serif. Weichere Kontraste und kräftigere Serifen machen sie für längere Texte auf dem Bildschirm geeigneter als die Display-Variante.
