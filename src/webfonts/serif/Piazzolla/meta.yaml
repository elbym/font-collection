content: |
  Piazzolla, entworfen von Juan Pablo del Peral bei Huerta Tipográfica und 2020 veröffentlicht, ist nach dem argentinischen Tango-Komponisten Astor Piazzolla benannt. Als Variableschrift mit Gewichts- und Kursiv-Achse verbindet sie Display-Expressivität mit Texttauglichkeit – eine charakterstarke Wahl für anspruchsvolle Layouts.
