content: |
  Vollkorn von Friedrich Althausen ist eine robuste, bodenständige Serifenschrift, die 2006 als freie Alternative für den täglichen Textsatz entwickelt wurde. Der Name steht Programm: Wie Vollkornbrot ist sie nahrhaft und substanziell – ohne Schnickschnack, aber mit Charakter und exzellenter Lesbarkeit für längere Texte.
