content: |
  Playfair von Claus Eggers Sørensen ist eine elegante Display-Serifenschrift mit humanistischen Einflüssen und hohem Strichkontrast. Die 2023 stark überarbeitete Version bringt umfangreiche OpenType-Features mit – Kapitälchen, Ziffernvarianten und kalligrafische Alternaten verleihen ihr besonderen Charakter für Buchtitel und Magazine.
