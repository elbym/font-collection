title: Amstelvar
url: https://fonts.google.com/specimen/Amstelvar

tags: Serif, Variable, Optical Sizes

fontauthor: David Berlow
fontyear: 2018

heroletter: Aa
heroword: "Amstelvar"
color: saddlebrown

content: |
  Amstelvar von David Berlow (Font Bureau) ist einer der ersten öffentlich verfügbaren parametrischen Variable Fonts und eine Referenzimplementierung für optische Größenanpassung. Neben der Gewichtsachse steuern mehrere Parametric Design Axes (XOPQ, XTRA, YTLC, YTUC usw.) einzelne formale Eigenschaften unabhängig voneinander — typografisches Lehrmodell und praktische Schrift zugleich.
