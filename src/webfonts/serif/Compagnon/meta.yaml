content: |
  Compagnon wurde als Abschlussarbeit an der École Supérieure des Arts et Sources de Saint-Luc (Belgien) von Juliette Duhe und Lea Pradine entwickelt. Die Slab-Serif-Schrift verbindet klassische Proportionen mit expressivem Strichkontrast und zeitgenössischer Lockerheit – ein eigenständiger Charakter fernab klassischer Revivals.
