content: |
  Zodiak von der Indian Type Foundry ist ein Display-Serif mit ausgeprägter Strichstärkenvariation und hohem Kontrast — entworfen für große Schriftgrade und plakative Headings. Die Axen-Gegensätze erinnern an klassische Didone-Schriften, ohne historisch zu wirken. Erhältlich via Fontshare als kostenloser Variable Font mit Gewichtsachse.
