content: |
  IBM Plex Serif ist der Serifen-Bestandteil von IBMs unternehmenseigener Schriftfamilie, entworfen von Mike Abbink, Paul van der Laan und Pieter van Rosmalen. Sie verbindet die sachliche Präzision einer Corporate-Schrift mit dem Charme humanistischer Serifentradition und lässt sich nahtlos mit IBM Plex Sans mischen.
