fontyear: 2023

heroletter: Pp
heroword: "Playpen"
color: hotpink

content: |
  Playpen Sans von TypeTogether ist eine handschriftlich inspirierte Sans-Serif, die den Charakter kindlicher Druckschrift mit Lesbarkeit für Bildschirme verbindet. Besonders für Bildungsanwendungen und Kinder-Interfaces konzipiert, wo Schreibschrift-Anmutung und hohe Erkennbarkeit einzelner Buchstaben gleichermaßen wichtig sind. Variable Font mit Gewichtsachse.
