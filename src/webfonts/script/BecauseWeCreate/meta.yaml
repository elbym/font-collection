title: Because We Create
url: https://github.com/RedHatOfficial/bwht-fonts

tags: Script, Handwriting, Display

fontauthor: Russ McMullin, Liz Wetzel, Aaron Williamson (Red Hat)
fontyear: 2019

heroletter: Cc
heroword: "Create"
color: darkorange

content: |
  Because We Create ist der ausdrucksstärkste Schnitt des „Because We Had To“-Sets von Red Hat und mit deutlichem Abstand der umfangreichste — der große Zeichensatz spiegelt den bewusst unregelmäßigen, gezeichneten Charakter. Gedacht für große Titel, nicht für Lauftext.
