title: Because We Mentor
url: https://github.com/RedHatOfficial/bwht-fonts

tags: Script, Handwriting, Display

fontauthor: Russ McMullin, Liz Wetzel, Aaron Williamson (Red Hat)
fontyear: 2019

heroletter: Mm
heroword: "Mentor"
color: mediumvioletred

content: |
  Because We Mentor stammt aus dem sechsteiligen Handschriften-Set, das Red Hat 2019 aus der Handschrift von Freundinnen und Kolleginnen entwickelte — im Umfeld einer Artikelserie über Frauen an der Schnittstelle von Kunst und Technologie. Kontextvarianten (`calt`) halten den Duktus in Bewegung.
