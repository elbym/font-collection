heroletter: Ss
heroword: "Satisfy"
color: rosybrown

content: |
  Satisfy ist eine elegante fließende Kursivschrift mit kalligrafischem Einschlag und klassischer Formensprache. Die verbundenen Buchstaben und der gleichmäßige Schwung verleihen ihr eine zeitlose Qualität zwischen historischer Schreibschrift und modernem Logodesign. Sie verbindet Script und Kalligrafie auf eine Art, die Sansita Swashed und die Handschriften im Bestand nicht abdecken.
