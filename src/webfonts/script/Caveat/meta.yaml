title: Caveat
url: https://fonts.google.com/specimen/Caveat

tags: Script, Handwriting

fontauthor: Pablo Impallari
fontyear: 2015

heroletter: Cc
heroword: "Hello!"
color: mediumpurple

content: |
  Caveat von Pablo Impallari ist eine lockere Alltagshandschrift mit natürlichem, ungekünsteltem Duktus. Variable Gewichte erlauben eine breite Einsatzbreite von leicht bis kräftig. Als europäisch geprägte Handschrift-Referenz ergänzt sie Kalam, das stark von indischer Kalligrafietradition beeinflusst ist — eine Lücke, die in der Sammlung bisher nicht besetzt war.
