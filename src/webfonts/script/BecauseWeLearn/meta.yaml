title: Because We Learn
url: https://github.com/RedHatOfficial/bwht-fonts

tags: Script, Handwriting, Display

fontauthor: Russ McMullin, Liz Wetzel, Aaron Williamson (Red Hat)
fontyear: 2019

heroletter: Ll
heroword: "Learn"
color: seagreen

content: |
  Because We Learn ist der zurückgenommenste Schnitt des „Because We Had To“-Sets: schmale, gleichmäßige Formen, kein `calt`-Wechselspiel wie bei den Geschwistern. Damit ist er der einzige der sechs, der sich auch für längere Passagen einsetzen lässt.
