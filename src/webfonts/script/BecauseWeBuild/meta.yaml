title: Because We Build
url: https://github.com/RedHatOfficial/bwht-fonts

tags: Script, Handwriting, Display

fontauthor: Russ McMullin, Liz Wetzel, Aaron Williamson (Red Hat)
fontyear: 2019

heroletter: Bb
heroword: "Build"
color: sienna

content: |
  Because We Build ist eine von sechs Handschriften, die Red Hat 2019 für die Artikelserie „Because We Had To“ entwickelte. Die Formen entstanden aus der echten Handschrift von Freundinnen und Kolleginnen — gesammelt, überarbeitet und zu einem vollen Zeichensatz ausgebaut. Eine `calt`-Kontextvariante sorgt dafür, dass sich Buchstabenformen im Textfluss abwechseln und die Zeile organisch wirkt.
