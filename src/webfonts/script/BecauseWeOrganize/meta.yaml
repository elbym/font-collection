title: Because We Organize
url: https://github.com/RedHatOfficial/bwht-fonts

tags: Script, Handwriting, Display

fontauthor: Russ McMullin, Liz Wetzel, Aaron Williamson (Red Hat)
fontyear: 2019

heroletter: Oo
heroword: "Organize"
color: goldenrod

content: |
  Because We Organize ist der kräftigste der sechs „Because We Had To“-Schnitte von Red Hat — breite, bestimmte Striche mit klarer Grundlinie. Wie die Geschwister nutzt er `calt`, um wiederkehrende Buchstaben leicht variieren zu lassen.
