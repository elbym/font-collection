    <base href="/font-collection/">
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="tailwind.css" />
    <!-- Direktaufruf einer Schrift (/<slug>#2): Raster bis zum Öffnen des Dialogs ausblenden, sonst blitzt es kurz durch (main.js entfernt das Attribut) -->
    <script>
      if (location.pathname !== new URL(document.baseURI).pathname) document.documentElement.dataset.direct = '';
    </script>
    <style>
      html[data-direct] #topbar,
      html[data-direct] #grid {
        visibility: hidden;
      }
    </style>
  </head>
  <body class="bg-neutral-100 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-50">
    <!-- Top-Bar: nur über der Rasterübersicht (das <dialog> liegt im Top-Layer und deckt sie ab).
       Hier können Bedienelemente in #tools eingehängt werden; `nodes` lässt sich vor dem Rendern filtern/sortieren. -->
    <header
      id="topbar"
      class="sticky top-0 z-20 flex min-h-12 flex-wrap items-center gap-x-3 gap-y-2 px-3 py-2 sm:px-4 sm:py-0 bg-neutral-100/95 dark:bg-neutral-950/95 [@media(hover:hover)]:backdrop-blur border-b border-neutral-300 dark:border-neutral-800"
    >
      <h1 class="shrink-0 whitespace-nowrap text-base font-semibold">Font Collection elbym</h1>
      <input
        id="search"
        type="search"
        placeholder="Suchen …"
        aria-label="Schriften durchsuchen"
        autocomplete="off"
        class="ml-auto w-32 shrink-0 rounded-full border border-neutral-500/50 bg-transparent px-3 py-1 text-sm sm:w-48"
      />
      <div
        id="tools"
        class="order-last flex w-full min-w-0 items-center gap-2 overflow-x-auto sm:order-none sm:w-auto"
      ></div>
      <a href="alternatives.html" class="text-sm underline">Alternativen</a>
      <a href="network.html" class="text-sm underline">Netzwerk</a>
      <a href="https://github.com/elbym/font-collection" target="_blank" rel="noopener" class="text-sm underline"
        >GitHub</a
      >
    </header>

    <!-- Rasterübersicht: Kacheln werden unten aus `nodes` erzeugt -->
    <main id="grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 p-3 sm:gap-4 sm:p-4"><noscript><h2>Because We Learn</h2><p>Script · Russ McMullin, Liz Wetzel, Aaron Williamson (Red Hat) · 2019</p><p>Because We Learn ist der zurückgenommenste Schnitt des „Because We Had To“-Sets: schmale, gleichmäßige Formen, kein `calt`-Wechselspiel wie bei den…</p></noscript></main>

    <!-- Detailansicht: natives <dialog> (Esc, Fokus, Hintergrundsperre inklusive); Karten rasten per scroll-snap ein -->
    <dialog
      id="detail"
      class="m-0 p-0 w-screen h-dvh max-w-none max-h-none bg-transparent text-neutral-900 dark:text-neutral-50 overflow-y-auto snap-y snap-mandatory overscroll-contain"
    >
      <button
        id="close"
        aria-label="Schließen"
        class="fixed top-3 right-3 z-10 size-11 rounded-full bg-neutral-500/20 text-2xl leading-none [@media(hover:hover)]:backdrop-blur hover:bg-neutral-500/40"
      >
        ×
      </button>
      <button
        id="prev"
        aria-label="Vorherige Karte"
        class="invisible hidden [@media(hover:hover)]:flex fixed top-1/2 -translate-y-1/2 left-3 z-10 size-12 items-center justify-center rounded-full bg-neutral-500/20 text-3xl leading-none hover:bg-neutral-500/40"
      >
        ‹
      </button>
      <button
        id="next"
        aria-label="Nächste Karte"
        class="invisible hidden [@media(hover:hover)]:flex fixed top-1/2 -translate-y-1/2 right-3 z-10 size-12 items-center justify-center rounded-full bg-neutral-500/20 text-3xl leading-none hover:bg-neutral-500/40"
      >
        ›
      </button>
      <div id="dots" class="fixed bottom-4 inset-x-0 z-10 flex justify-center gap-2 pointer-events-none"></div>
      <div id="cards"></div>
    </dialog>

    <!-- Druckansicht (LaTeX-Look): wird von print.js für die aktuelle Schrift gefüllt, nur in @media print sichtbar -->
    <article id="print" lang="de"></article>

    <script type="module" src="main.js"></script>
  </body>
