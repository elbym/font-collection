title: Bebas Neue
url: https://fonts.google.com/specimen/Bebas+Neue

tags: Display, Condensed, Grotesk

fontauthor: Ryoichi Tsunekawa
fontyear: 2010

heroletter: Bb
heroword: "BEBAS"
herostyle: bold
color: crimson

content: |
  Bebas Neue von Ryoichi Tsunekawa ist der kondensierte Versalien-Display-Grotesk schlechthin — eine der meistgenutzten und meistkopierten Headline-Schriften der letzten fünfzehn Jahre. Als Referenz-Schrift für die Kategorie Condensed Display ist ihr Fehlen im Bestand eine echte Lücke: Kein anderer Vertreter deckt diese visuelle Position ab.
