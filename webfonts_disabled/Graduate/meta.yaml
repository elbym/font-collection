content: |
  Graduate ist eine parametrische Variable-Font-Studie von Eduardo Tunni, die klassische Slab-Serif-Formen mit zwölf frei kombinierbaren Achsen verbindet — darunter Kontrast, Serifenstärke, Achsenkoordinaten (X/Y-Opaque, X/Y-Transient) und optische Größe. Statt weniger Standardschnitte erlaubt sie ein Kontinuum an Zwischenformen zwischen sachlich und dekorativ.
