tags: Display, Condensed, Variable

fontauthor: Ethan Nakamura
fontyear: 2022

heroletter: An
heroword: "Anybody"
color: darkorchid

content: |
  Anybody von Ethan Nakamura ist ein ungewöhnlich vielseitiger Variable Font, der über Breiten- und Gewichtsachse das gesamte Spektrum von Ultra-Condensed bis Ultra-Expanded abdeckt. Was als typisches Display-Werkzeug beginnt, entfaltet durch die Breitenachse einen spielerischen Charakter: Schmal erinnert er an Plakattradition, breit an Konzeptdesign der 1970er.
