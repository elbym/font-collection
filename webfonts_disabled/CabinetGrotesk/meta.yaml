content: |
  Cabinet Grotesk von der Indian Type Foundry ist ein editorialer Grotesk mit Display-Qualität und variabler Gewichtsskala. Anders als funktionale Brot-Grotesken besitzt sie einen deutlich ausgeprägteren Charakter, der besonders in großen Größen zur Geltung kommt. Verfügbar über Fontshare, nicht Google Fonts.
