tags: Serif, Humanist, Garalde

fontauthor: Pablo Impallari
fontyear: 2011

heroletter: Qq
heroword: "Quattro"
color: sienna

content: |
  Quattrocento von Pablo Impallari ist ein eleganter Humanist-Serif mit breiter Laufweite und klassisch-italienischem Charakter. Die weiten Gegenformen und die luftige Proportionierung unterscheiden ihn deutlich von Cormorant und EB Garamond — er steht weniger für Display-Eleganz als für ruhige, breite Lesbarkeit in mittleren Schriftgrößen.
