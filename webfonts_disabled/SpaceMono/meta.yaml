tags: Monospace, Geometric

fontauthor: Colophon Foundry
fontyear: 2016

heroletter: Ss
heroword: "Space"
color: darkorchid

content: |
  Space Mono ist ein geometrisches Monospace mit Display-Qualität, entworfen von Colophon Foundry für Google Fonts. Anders als die meisten Coding-Monos wird sie häufig für Headlines und Titelgestaltung eingesetzt — die ungewöhnlichen Buchstabenproportionen und die starke visuelle Präsenz verleihen ihr Eigencharakter, der weit über den Codekontext hinausgeht.
