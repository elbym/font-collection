title: Anton
url: https://fonts.google.com/specimen/Anton

tags: Display, Condensed, Grotesk

fontauthor: Vernon Adams
fontyear: 2011

heroletter: Aa
heroword: "ANTON"
herostyle: bold
color: orangered

content: |
  Anton von Vernon Adams ist ein komprimierter Bold-Grotesk mit ikonischer Wirkung — im Web als Headline-Font mit außergewöhnlich hoher Erkennbarkeit. Zusammen mit Bebas Neue deckt er die Kategorie kondensierter Display-Grotesken ab, spricht aber eine andere Formensprache: breiter, flacher, weniger geometrisch eng.
