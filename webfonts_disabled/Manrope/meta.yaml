content: |
  Manrope von Mikhail Sharanda ist ein geometrischer Grotesque mit variabler Gewichtsskala, der trotz seiner breiten Verbreitung eine eigenständige Persönlichkeit bewahrt. Gegenüber Space Grotesk wirkt er ruhiger und systematischer; gegenüber Inter besitzt er mehr geometrische Strenge. Solide für Textsatz und Headline gleichermaßen.
