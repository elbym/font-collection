tags: Sans, Geometric, Grotesk

fontauthor: Corey Hu
fontyear: 2020

heroletter: Uu
heroword: "Urbanist"
color: steelblue

content: |
  Urbanist von Corey Hu ist ein schlanker geometrischer Grotesque mit niedriger Strichstärkenvariation und weiten Innenformen. Die Schrift lehnt sich an Futura an, bürstet aber viele klassische Ecken glatt: Opt-in-Alternative zu runden Grotesken wie Nunito, ohne deren Weichheit zu übernehmen. Variable Font mit vollständiger Gewichtsskala.
