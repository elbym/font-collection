content: |
  Gidole ist eine humanistische, minimalistische Interpretation der DIN-Grotesk – benannt nach einer Kleinstadt im Süden Äthiopiens. Die Schrift reduziert die technische Strenge der klassischen Normschrift auf klare, ruhige Formen und eignet sich dadurch für Interfaces ebenso wie für Fließtext.
