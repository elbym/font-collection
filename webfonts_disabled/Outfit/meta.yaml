content: |
  Outfit von Rodrigo Fuenzalida ist ein schlichter geometrischer Grotesque, der Futura als Ausgangspunkt nimmt, aber für Bildschirmlesbarkeit optimiert ist. Kreisförmige Gegenformen, gleichmäßige Strichstärken und eine variable Gewichtsskala machen ihn zu einem gefälligen Standard-Grotesque für Web und App — ohne starke eigene Persönlichkeit, aber zuverlässig.
