content: |
  Asap (spanisch: sofort) ist eine humanistische Groteskschrift von Omnibus-Type, die für platzsparende und dennoch gut lesbare Typografie auf Bildschirmen konzipiert wurde. Der kompakte Laufweite macht sie besonders nützlich in Interfaces und Layouts mit wenig Platz.
