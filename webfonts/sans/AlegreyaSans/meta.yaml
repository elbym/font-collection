fontauthor: Juan Pablo del Peral, Huerta Tipográfica
fontyear: 2013

heroletter: Aa
heroword: Alegría

content: |
  Alegreya Sans ist die serifenlose Schwester von [[Alegreya]] und teilt deren kalligrafischen Rhythmus. Die humanistische Grotesk hat eine echte, geschriebene Kursive und eignet sich dank ihrer lebendigen Formen auch für längere Texte.
