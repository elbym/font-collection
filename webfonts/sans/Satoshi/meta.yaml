content: |
  Satoshi von der Indian Type Foundry ist ein sauberer Neo-Grotesk, der sich in den letzten Jahren zur meistgenutzten Schrift im modernen Produktdesign entwickelt hat — verfügbar über Fontshare, nicht Google Fonts. Mit seinen subtil humanistischen Details und der ausgewogenen Gewichtsskala ergänzt er Inter um eine andere, etwas wärmere Energie.
