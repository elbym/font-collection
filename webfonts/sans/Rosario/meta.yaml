content: |
  Rosario ist eine humanistische Grotesk des argentinischen Schriftgestalters Héctor Gatti, benannt nach der Großstadt Rosario. Gatti entwarf sie zunächst für den eigenen Gebrauch; 2004 wurde sie in die Auswahl der Biennale Letras Latinas aufgenommen, später baute das Omnibus-Type-Team sie aus und Adobe Fonts optimierte sie. Klassische Proportionen und weich auslaufende Strichenden machen sie zurückhaltend und doch lebendig, gedacht für Zeitschriften, Lyrikbände, illustrierte Ausgaben und Fachzeitschriften. Fünf Gewichte von Light bis Bold, jeweils mit echter Kursive.
