content: |
  Bricolage Grotesque von Mathieu Triay ist ein expressiver Display-Grotesk mit handgemachtem Charakter. Variable Achsen für Breite (wdth) und Gewicht (wght) ermöglichen ein breites gestalterisches Spektrum — von kompakt-neutral bis weit und dekorativ. Die bewusst unrunde, persönliche Formensprache unterscheidet sie von glatteren Geometric-Grotesken.
