content: |
  Mozilla Text ist der Slab-Serif-Bestandteil der 2024 von Studio DRAMA entworfenen Mozilla-Schriftfamilie. Als Textschrift verbindet sie die Robustheit von Slab-Serifs mit humanistischer Wärme und ergänzt Mozilla Headline in Layouts, die eine Serienkomposition aus Überschrift und Fließtext benötigen.
