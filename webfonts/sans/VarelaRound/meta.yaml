title: Varela Round
url: https://fonts.google.com/specimen/Varela+Round

tags: Sans, Rounded

fontauthor: Joe Prince
fontyear: 2011

heroletter: Vv
heroword: "Round"
color: cornflowerblue

content: |
  Varela Round von Joe Prince ist ein kompakter, sanft gerundeter Grotesk mit hoher Lesbarkeit und freundlichem Tonfall. Die Familie besticht durch ihre geschlossene, utilitaristische Form – angenehm weich aber nicht zu verspielt. Sie ist die kompakteste der drei Rundschriften dieser Sammlung — nur ein Schnitt, dafür ohne jede Verzierung.
