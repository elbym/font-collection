content: |
  BDO Grotesk ist eine Neo-Grotesk von Deni Anggara, veröffentlicht über die Schriftgießerei Lokal Container. Sie umfasst sieben Schnitte von Light bis Black und ist auch als variable Schrift erhältlich. Der Entwurf verbindet zeitgemäße Formen mit sachlicher Lesbarkeit.
