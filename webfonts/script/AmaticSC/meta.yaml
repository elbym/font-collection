tags: Script, Handwriting, Display

fontauthor: Vernon Adams
fontyear: 2012

heroletter: Aa
heroword: "Amatic"
color: lightcoral

content: |
  Amatic SC von Vernon Adams ist eine handgezeichnete Small-Caps-Schrift mit individuellem, leicht unregelmäßigem Stil. Als einzige Small-Caps-Handschrift in der Sammlung schließt sie die Lücke zwischen alltäglichen Handschriften wie Caveat und den dekorativen Display-Scripts — ein eigenständiger Platz in einer Kategorie, die sonst keine vergleichbare Schrift besetzt.
