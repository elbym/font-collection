content: |
  Sansita Swashed von Omnibus-Type kombiniert die klare Struktur einer humanistischen Sans-Serif mit dekorativen Schwüngen und Zierstrichen. Die großzügigen Swashes verleihen der Schrift eine festliche, expressive Qualität – ideal für Einladungen, Logos und elegante Display-Typografie.
