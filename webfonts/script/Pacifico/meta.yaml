title: Pacifico
url: https://fonts.google.com/specimen/Pacifico

tags: Script, Display

fontauthor: Vernon Adams
fontyear: 2011

heroletter: Pp
heroword: "Pacifico"
herostyle: bold
color: hotpink

content: |
  Pacifico von Vernon Adams ist ein runder, fetter Brush-Script mit unverkennbarem 1950er-Retro-Charakter. Die Energie ist grundlegend anders als kalligrafische oder elegante Skriptschriften — fett, dekorativ, laut. Als Display-Script besetzt sie eine Position, die weder Playwrite noch Kalam füllen können.
