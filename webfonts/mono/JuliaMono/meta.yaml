content: |
  JuliaMono entstand 2020 im Umfeld der Programmiersprache Julia, deren Quelltext oft Unicode-Zeichen wie griechische Buchstaben, mathematische Operatoren und Pfeile enthält. Entsprechend riesig ist der Zeichenvorrat mit mehreren tausend Glyphen. Die Kursive ist echt gezeichnet, mit einstöckigem a, f mit Unterlänge und geschwungenem l. Hier liegen die offiziellen Webfonts aus Release 0.63.2 unverändert (der Name „JuliaMono“ ist in der Lizenz reserviert, verkleinerte Dateien müssten anders heißen), deshalb nur Regular und Bold mit Kursiven.
