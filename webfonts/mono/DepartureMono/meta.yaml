heroletter: Dd
heroword: "DEPART"
color: limegreen

content: |
  Departure Mono ist eine bewusst gestaltete Pixel-Monospace-Schrift mit starker Retro-Persönlichkeit. Helena Zhang hat sie als eigenständiges gestalterisches Statement entwickelt, nicht als funktionalen Kompromiss: Die pixelhafte Strenge ist Absicht, kein Zufall. Ideal für Projekte, die Terminalästhetik als visuelles Thema einsetzen wollen.
