content: |
  Ubuntu Sans Mono ist seit Ubuntu 24.04 die Standard-Monospace-Schrift der Distribution und folgt auf Ubuntu Mono. Canonical ließ die Ubuntu-Familie ab 2010 bei Dalton Maag entwickeln und 2022–2023 als variable Schrift überarbeiten. Die Mono-Variante behält den humanistischen, leicht abgerundeten Ubuntu-Charakter und hat eine echte Kursive. Aufrecht reicht die Gewichtsachse von 100 bis 700, kursiv von 400 bis 700.
