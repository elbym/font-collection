content: |
  Geist Mono ist Vercels 2023 unter der OFL veröffentlichte Coding-Schrift. Als Gegenstück zur serifenlosen Geist-Textschrift teilt sie deren klare, funktionale Linienführung — optimiert für Terminals, Code-Editoren und Entwickler-Interfaces. Sie vervollständigt das Geist-Paar in dieser Sammlung, die bisher nur die Sans enthielt.
