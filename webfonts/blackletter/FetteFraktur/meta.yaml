title: Fette Fraktur
url: https://fonts.google.com/specimen/Fette+Fraktur

tags: Blackletter, Display

fontauthor: Peter Wiegel (revival)
fontyear: 2012

heroletter: Ff
heroword: "Fraktur"
herostyle: bold
color: darkred

content: |
  Fette Fraktur ist eine digitale Rekonstruktion der klassischen deutschen Zeitungs-Fraktur des 19. Jahrhunderts — ein historisches Original, das die zeitlosesten und wiedererkennbarsten Formen des Blackletter-Stils in maximaler Strichstärke präsentiert. Als Kontrastpunkt zu den modernen Interpretationen Grenze und Unifraktur fehlt sie als historische Referenz bisher im Bestand.
