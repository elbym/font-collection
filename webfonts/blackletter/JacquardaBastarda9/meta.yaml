content: |
  Jacquarda Bastarda 9 ist eine proportionale Bitmap-Blackletter, die auf einem 9-Pixel-Raster konstruiert wurde. Sie vereint zwei Besonderheiten in einer Schrift: den gotischen Bastarda-Stil mit der strukturellen Präzision eines Pixel-Fonts. Die prägnanten Formen machen sie ideal für Überschriften, Plakate und Displayzwecke mit klarem, charaktervollem Ausdruck.
