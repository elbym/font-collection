content: |
  UnifrakturCook ist eine digitalisierte Schwabacher-Variante der "Koch fette deutsche Schrift" und bietet einen breiteren, runderen Charakter als klassische Textfrakturen. Die Schrift eignet sich besonders gut für Display- und Überschriftenzwecke und wird vom UniFraktur-Projekt gepflegt. Mit vollständiger Unicode-Unterstützung und erweiterten Ligaturen ist sie ideal für die anspruchsvolle Darstellung historischer und moderner deutschsprachiger Typographie.
