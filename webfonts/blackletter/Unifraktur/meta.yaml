content: |
  Unifraktur ist eine digitale Frakturschrift, die auf dem Design von Carl Albert Fahrenwaldt aus dem Jahr 1901 basiert. Das seit 2010 von j-mach-wust, wrzlprmft und anderen gepflegte Projekt legt besonderen Wert auf vollständige Unicode-Unterstützung – damit eignet sich die Schrift auch für die korrekte digitale Darstellung historischer deutschsprachiger Texte.
