content: |
  Tex Gyre Pagella ist die freie Entsprechung zu Hermann Zapfs Palatino, einer der einflussreichsten humanistischen Serifenschriften des 20. Jahrhunderts. Zapf entwarf Palatino Ende der 1940er Jahre an der Stempel-Schriftgießerei in Frankfurt; die breiten Proportionen und der weiche Duktus spiegeln seinen Einfluss als Kalligraf wider.
