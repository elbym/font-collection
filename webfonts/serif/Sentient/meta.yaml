content: |
  Sentient von der Indian Type Foundry ist ein humanistischer Serif mit moderater Strichstärkenvariation, der den Bogen zwischen klassischen Buchserifs und zeitgemäßen Displayanforderungen schlägt. Die offenen Gegenformen und klar differenzierten Serifen machen ihn sowohl für Textsatz als auch für Überschriften brauchbar. Variable Font mit Gewichtsachse via Fontshare.
