content: |
  Lora von Cyreal ist eine zeitgenössische Serifenschrift, die kalligrafischen Schreibfluss mit modernen Proportionen verbindet. Die ausgewogene Strichführung und die an Kursivschriften erinnernden Details machen sie zu einer vielseitigen Wahl für Körpertext im Web und in gedruckten Publikationen.
