content: |
  GFS Didot der Greek Font Society ist ein Revival der Didot-Schriftfamilie in ihrer griechischen Ausprägung. Die Schrift basiert auf dem historischen Einsatz von Didots Didone-Formen für das griechische Alphabet im frühen 19. Jahrhundert und eignet sich für zweisprachige Satzarbeiten mit lateinischen und griechischen Texten.
