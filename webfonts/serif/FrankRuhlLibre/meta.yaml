title: Frank Ruhl Libre
url: https://github.com/fontef/frankruhllibre

tags: Serif, Hebräisch, Variable

fontauthor: Yanek Iontef, Michal Sahar (nach Raphael Frank, 1908)
fontyear: 2016

heroletter: Ff
heroword: Frank
color: mediumblue

content: |
  Frank Ruhl Libre ist eine digitale Neufassung des Klassikers Frank-Rühl, seit 1908 die Standard-Hebräischschrift für Bücher. Diese Variable Font kombiniert die hebräische Tradition mit einem passenden lateinischen Satz — mehr Schriftsysteme deckt sie nicht ab. Beachten Sie: Die Abdeckungsanzeige auf der Specimen-Seite zeigt nur lateinische Blöcke; der hebräische Bereich ist dort nicht aufgelistet.
