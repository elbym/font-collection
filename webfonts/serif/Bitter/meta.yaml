title: Bitter
url: https://fonts.google.com/specimen/Bitter

tags: Serif, Slab Serif

fontauthor: Huerta Tipográfica
fontyear: 2011

heroletter: Bb
heroword: "Bitter"
color: chocolate

content: |
  Bitter von Huerta Tipográfica wurde explizit für langen Fließtext auf Bildschirmen konzipiert: robuste Serifen, hoher x-Grad und gleichmäßige Strichstärken sorgen auch bei kleinen Größen für hohe Lesbarkeit. Seit Version 2 als Variable Font mit voller Gewichtsskala. Als eigenständige Screen-Slab füllt sie eine Lücke, die Arvo und Compagnon mit ihrer eher druckorientierten Ausrichtung lassen.
