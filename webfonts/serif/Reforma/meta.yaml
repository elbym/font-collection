content: |
  Reforma ist ein Schriftprojekt der argentinischen Schriftgießerei PampaType, das dasselbe Design in drei koexistierenden Varianten anbietet: Serif, Sans und einen Hybrid, der beide Formen vermischt. Die drei Schnitte teilen identische Metrik und können frei kombiniert werden — ein konzeptionell einzigartiger Ansatz im Bereich freier Schriften.
