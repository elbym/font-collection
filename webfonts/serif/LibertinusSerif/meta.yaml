content: |
  Libertinus Serif ist ein aktiv gepflegter Fork von Linux Libertine, der ursprünglich als freie Alternative zu Times New Roman für den Linux-Desktop entwickelt wurde. Philipp H. Poll und die Community haben die Schrift um vollständige OpenType-Unterstützung, mathematische Symbole und umfangreiche Sprachabdeckung erweitert.
