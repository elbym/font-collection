content: |
  Spectral von Production Type ist eine Bildschirm-optimierte Variableschrift für intensives Lesen in digitalen Umgebungen. Mit einem Gewichtsbereich von ExtraLight bis Bold und eigenen Kursivschnitten bietet sie hohe Flexibilität; ihre präzise Hinting-Strategie sorgt für gute Lesbarkeit auch bei kleinen Schriftgrößen.
