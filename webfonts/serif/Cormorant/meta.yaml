content: |
  Cormorant von Christian Thalmann ist eine an Claude Garamonds historische Drucktypen angelehnte Display-Serifenschrift mit außergewöhnlicher Detailtiefe. Umfangreiche OpenType-Features – Swash-Varianten, kalligrafische Alternaten und ausgefeilte Glyphensätze – machen sie besonders für hochwertige Buch- und Titelgestaltung geeignet.
