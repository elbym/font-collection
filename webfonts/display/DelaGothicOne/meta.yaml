content: |
  Dela Gothic One von Morisawa ist ein fetter japanisch-beeinflusster Display-Sans mit extremer Strichstärke und kompromissloser Präsenz. Die geometrische Strenge trifft auf eine kulturelle Ästhetik, die in westlichen Schriften ohne Präzedenz ist — ein visueller Ursprung, der alle anderen Display-Schriften in der Sammlung klar unterscheidet.
