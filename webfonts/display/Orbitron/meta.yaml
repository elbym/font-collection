heroletter: Aa
heroword: Orbit
color: deepskyblue

content: |
  Orbitron von Matt McInerney (The League of Moveable Type) ist eine geometrische, breit angelegte Display-Grotesk mit eckig-gerundeten Formen – die Schrift der Science-Fiction-Titel, Raumschiff-Cockpits und Gaming-Interfaces. Die Variable Font von Google Fonts deckt die Gewichte von Regular bis Black ab. Am stärksten in Versalien und großen Größen, als Fließtext ungeeignet.
