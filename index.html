<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Schriften</title>
  <base href="/">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="tailwind.css">
  <style>
    /* Kachel <-> Karte: gemeinsames Element "node" wird per View Transition ineinander überführt */
    ::view-transition-group(*) { animation-duration: .4s; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
    /* Ecken: Radius der Kachel (rounded-2xl = 1rem) läuft beim Öffnen auf 0, beim Schließen zurück */
    ::view-transition-image-pair(node) { overflow: clip; animation: .4s cubic-bezier(.2,.8,.2,1) both radius; }
    html[data-dir=close]::view-transition-image-pair(node) { animation-direction: reverse; }
    @keyframes radius { from { border-radius: 1rem; } to { border-radius: 0; } }
    /* Akzentfarbe der Schrift (--accent, inline gesetzt): auf hellem Grund abgedunkelt, auf dunklem aufgehellt */
    .acc { --accent-ui: color-mix(in oklab, var(--accent), black 15%); }
    @media (prefers-color-scheme: dark) { .acc { --accent-ui: color-mix(in oklab, var(--accent), white 25%); } }
    @media (prefers-reduced-motion: reduce) { ::view-transition-group(*) { animation-duration: 0s; } }
  </style>
</head>
<body class="bg-neutral-100 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-50">

  <!-- Top-Bar: nur über der Rasterübersicht (das <dialog> liegt im Top-Layer und deckt sie ab).
       Hier können Bedienelemente in #tools eingehängt werden; `nodes` lässt sich vor dem Rendern filtern/sortieren. -->
  <header id="topbar" class="sticky top-0 z-20 flex h-12 items-center gap-3 px-3 sm:px-4 bg-neutral-100/80 backdrop-blur dark:bg-neutral-950/80 border-b border-neutral-300 dark:border-neutral-800">
    <h1 class="text-base font-semibold">Schriften</h1>
    <div id="tools" class="ml-auto flex items-center gap-2"></div>
  </header>

  <!-- Rasterübersicht: Kacheln werden unten aus `nodes` erzeugt -->
  <main id="grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 p-3 sm:gap-4 sm:p-4"></main>

  <!-- Detailansicht: natives <dialog> (Esc, Fokus, Hintergrundsperre inklusive); Karten rasten per scroll-snap ein -->
  <dialog id="detail" class="m-0 p-0 w-screen h-dvh max-w-none max-h-none bg-transparent text-neutral-900 dark:text-neutral-50 overflow-y-auto snap-y snap-mandatory overscroll-contain">
    <button id="close" aria-label="Schließen"
      class="fixed top-3 right-3 z-10 size-11 rounded-full bg-neutral-500/20 text-2xl leading-none backdrop-blur hover:bg-neutral-500/40">×</button>
    <div id="dots" class="fixed bottom-4 inset-x-0 z-10 flex justify-center gap-2 pointer-events-none"></div>
    <div id="cards"></div>
  </dialog>

  <script type="module">
    // Schriften kommen aus dem 11ty-CMS (fonts.json). Jede Schrift hat gleich viele Detailkarten (DETAILS).
    const DETAILS = 4;
    const nodes = await (await fetch('fonts.json')).json();

    const grid = document.getElementById('grid');
    const cards = document.getElementById('cards');
    const detail = document.getElementById('detail');

    // Inhalt der Detailkarten in em/cqw: Kachel = Karte 1 verkleinert. Pro Karte ein eigener Block (CARDS), damit sie einzeln änderbar sind.
    // --- Karte 1: Name + Aa (auch Kachel) ---
    const card1 = n => `
      <p data-vt="title" class="${n.family} text-[1.5em] leading-tight">${n.title}</p>
      <div class="my-[.5em] h-[.15em] w-[3em] bg-[color:var(--accent-ui)]"></div>
      <p data-vt="aa" class="${n.family} text-[8em] leading-none text-[color:var(--accent-ui)]">Aa</p>`;
    // --- Karte 2: Poster A (Zeichensatz) ---
    const card2 = n => {
      // Zeichen, die laut n.glyphs fehlen, weglassen (glyphs null = alle vorhanden); HTML-Sonderzeichen escapen
      const keep = s => [...s].filter(c => !n.glyphs || n.glyphs.includes(c.codePointAt(0))).join('');
      const esc = s => s.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
      const seq = (s, size) => `<p class="${size} whitespace-nowrap leading-[1.2] tracking-[.04em]">${esc(keep(s))}</p>`;
      // Alphabet in einer Zeile mit fester Größe: passt bei den meisten Schriften in die Plakatbreite, sehr breite (z. B. Climate Crisis) laufen bewusst über den Rand
      const ALPHA = 'text-[5cqw]';
      const hero = keep(n.heroletter || 'Aa');
      const heroSize = hero.length <= 2 ? 'text-[52cqw]' : hero.length <= 3 ? 'text-[36cqw]' : 'text-[26cqw]'; // nach Länge
      const meta = [n.author, n.year].filter(Boolean).join(', ');
      const rule = '<div class="h-[.4cqw] w-full bg-[color:var(--accent-ui)]"></div>';
      return `
        <div class="${n.family} w-full h-full flex justify-center">
          <div class="w-[min(100cqw,70cqh)] h-full min-h-0 [container-type:inline-size]">
          <div class="h-full flex flex-col gap-[2.5cqw] p-[6cqw] pb-[14cqw] text-left">
            <!-- ponytail: Padding im inneren Div, damit cqw-Werte auf die Plakatbreite (nicht die Karte) beziehen -->

            <p class="text-[3.6cqw] leading-tight">${esc(n.title)}</p>
            ${meta ? `<p class="text-[2.8cqw] opacity-60">${esc(meta)}</p>` : ''}
            ${rule}
            <p class="${heroSize} flex-1 min-h-0 flex items-center leading-none whitespace-nowrap text-[color:var(--accent-ui)]">${esc(hero)}</p>
            ${rule}
            ${seq('ABCDEFGHIJKLMNOPQRSTUVWXYZ', ALPHA)}
            ${seq('abcdefghijklmnopqrstuvwxyz', ALPHA)}
            ${seq('0123456789', ALPHA)}
            ${seq('.,:;!?-–—_()[]{}', 'text-[4.5cqw]')}
            ${seq("/\\&@#%*+=<>|~^\"'„“”‚‘’…", 'text-[4.5cqw]')}
          </div>
          </div>
        </div>`;
    };
    // --- Karte 3: Poster B (Schnitte, Fließtext) ---
    const card3 = n => {
      const PANGRAM = 'Victor jagt zwölf Boxkämpfer quer über den großen Sylter Deich.';
      const LOREM = 'Lorem ipsum dolor sit amet, consectetuer adipiscing elit. Aenean commodo ligula eget dolor. Aenean massa. Cum sociis natoque penatibus et magnis dis parturient montes, nascetur ridiculus mus. Donec quam felis, ultricies nec, pellentesque eu, pretium quis, sem.';
      const NAME = { 100: 'Thin', 200: 'ExtraLight', 300: 'Light', 400: 'Regular', 500: 'Medium', 600: 'SemiBold', 700: 'Bold', 800: 'ExtraBold', 900: 'Black' };
      // Zeilenhöhe teilt die verfügbare Höhe (in cqh) auf alle Zeilen auf, maximal 2.6cqw
      const fs = (k, total) => `min(max(2.6cqw,11px),${(total / k).toFixed(2)}cqh)`;
      // Zeilengröße hängt von der Schnittanzahl ab (Daten) und steht deshalb einmal inline am Raster; die Zellen erben sie
      const WEIGHT = { 100: 'font-thin', 200: 'font-extralight', 300: 'font-light', 400: 'font-normal', 500: 'font-medium', 600: 'font-semibold', 700: 'font-bold', 800: 'font-extrabold', 900: 'font-black' };
      const list = (ws, total, label) => `<div style="font-size:${fs(ws.length, total)}" class="grid grid-cols-[auto_1fr] content-start gap-x-[2.5cqw] leading-[1.1] whitespace-nowrap">${ws.map(w => `
        <span>${label(w)}</span>
        <span class="${WEIGHT[w.weight]} ${w.italic ? 'italic' : ''}">Boxkämpfer</span>`).join('')}</div>`;
      const waterfall = ['text-[length:min(7.5cqw,8cqh)]', 'text-[length:min(4.8cqw,5.2cqh)]', 'text-[length:min(3.2cqw,3.4cqh)]']
        .map(size => `<p class="${size} leading-[1.2]">${PANGRAM}</p>`).join('');
      const gradient = Array.from({ length: 9 }, (_, k) => ({ weight: 100 + 100 * k, italic: false }));
      return `
      <div class="${n.family} p-[max(5cqw,3.75rem)_5cqw_5cqw] w-full h-full flex flex-col gap-[2.5cqh] overflow-hidden text-left">
        <div class="flex items-baseline justify-between gap-[3cqw]">
          <p class="text-[length:min(4cqw,4.5cqh)] leading-tight">${n.title}</p>
          <p class="text-[length:min(2.4cqw,2.6cqh)] uppercase tracking-widest text-[color:var(--accent-ui)]">${n.weights.length} Schnitte</p>
        </div>
        <div>${waterfall}</div>
        <div class="grid sm:grid-cols-2 content-start gap-x-[5cqw] gap-y-[3cqh]">
          <div>${list(n.weights, 34, w => NAME[w.weight] + (w.italic ? ' Italic' : ''))}</div>
          <div class="flex flex-col gap-[2cqh]">
            ${n.variable ? `
            <p class="text-[length:min(2.4cqw,2.6cqh)] uppercase tracking-widest text-[color:var(--accent-ui)]">Gewichtsverlauf</p>
            ${list(gradient, 16, w => w.weight)}` : ''}
            <p class="text-[length:min(max(3cqw,13px),3.2cqh)] line-clamp-3 sm:line-clamp-6 leading-[1.35]">${LOREM}</p>
          </div>
        </div>
      </div>`;
    };
    // --- Karte 4: Infos ---
    const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    const host = u => { try { return new URL(u).hostname; } catch { return u; } };
    const card4 = n => {
      const rows = [['Designer', n.author], ['Jahr', n.year], ['Lizenz', n.license]]
        .filter(([, v]) => v != null && v !== '')
        .map(([k, v]) => `<dt class="opacity-60">${k}</dt><dd>${esc(v)}</dd>`);
      if (n.source) rows.push(`<dt class="opacity-60">Quelle</dt><dd><a href="${esc(n.source)}" target="_blank" rel="noopener" class="underline underline-offset-4 text-[color:var(--accent-ui)]">${esc(host(n.source))}</a></dd>`);
      return `
        <p class="${n.family} text-[2em] leading-tight">${esc(n.title)}</p>
        <div class="my-[.5em] h-[.15em] w-[3em] bg-[color:var(--accent-ui)]"></div>
        ${rows.length ? `<dl class="grid grid-cols-[auto_1fr] gap-x-[1em] gap-y-[.3em] max-w-[28em] text-left">${rows.join('')}</dl>` : ''}
        ${n.tags?.length ? `<ul class="mt-[1em] flex flex-wrap justify-center gap-[.4em]">${n.tags.map(t => `<li class="rounded-full border border-[color:var(--accent-ui)] px-[.7em] py-[.15em] text-[.8em]">${esc(t)}</li>`).join('')}</ul>` : ''}
        ${n.comment ? `<p class="mt-[1em] max-w-[24em] text-[.85em] opacity-70">${esc(n.comment)}</p>` : ''}`;
    };
    // --- Ende Karten ---
    const CARDS = [card1, card2, card3, card4];
    const content = (n, c) => CARDS[c](n);
    const acc = n => `--accent:${n.accent}`;

    nodes.forEach((n, i) => {
      // Kachel: Container, Schrift skaliert mit der Kachelbreite (cqw)
      grid.insertAdjacentHTML('beforeend', `
        <button data-i="${i}" style="${acc(n)}"
          class="acc scroll-mt-12 [container-type:inline-size] aspect-square rounded-2xl bg-white dark:bg-neutral-900 hover:brightness-95 active:scale-95 transition-transform">
          <div class="text-[5cqw] h-full flex flex-col items-center justify-center p-[6cqw] text-center">${content(n, 0)}</div>
        </button>`);
      cards.insertAdjacentHTML('beforeend', `
        <div class="row h-dvh flex overflow-x-auto overflow-y-hidden snap-x snap-mandatory snap-start snap-always overscroll-x-contain [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
          ${Array.from({ length: DETAILS }, (_, c) => `
            <section style="${acc(n)}" class="acc bg-white dark:bg-neutral-950 [container-type:size] [content-visibility:auto] snap-start snap-always shrink-0 w-full h-dvh flex flex-col items-center justify-center p-6 text-center text-base sm:text-[1.25rem]">${content(n, c)}</section>`).join('')}
        </div>`);
    });

    // Punkte: eine Anzeige für die aktuelle Detailkarte
    const dots = document.getElementById('dots');
    dots.innerHTML = '<i class="size-2 rounded-full bg-neutral-500/40 transition"></i>'.repeat(DETAILS);
    let col = 0; // zuletzt sichtbare Detailkarte (gilt für alle Nodes)
    const setDot = c => { col = c; [...dots.children].forEach((d, k) => d.classList.toggle('!bg-neutral-500', k === c)); };
    setDot(0);

    // Gleiche Detailkarte in allen Nodes: sobald ein Row ausgescrollt ist, ziehen die anderen nach
    // ponytail: Debounce statt scrollend (Safari < 26 kennt es nicht)
    let syncTimer;
    cards.addEventListener('scroll', e => {
      setDot(Math.round(e.target.scrollLeft / e.target.clientWidth));
      syncUrl();
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => {
        for (const row of cards.children) if (row !== e.target) row.scrollLeft = e.target.scrollLeft;
      }, 100);
    }, true);

    // aktuell sichtbare Karte (Node i, Detailkarte c)
    const current = () => {
      const row = cards.children[Math.round(detail.scrollTop / detail.clientHeight)];
      return { i: [...cards.children].indexOf(row), card: row.children[Math.round(row.scrollLeft / row.clientWidth)] };
    };

    // ponytail: ohne View-Transitions-Support (ältere Browser) wird einfach ohne Animation umgeschaltet
    const transition = (dir, fn) => {
      document.documentElement.dataset.dir = dir;
      return document.startViewTransition ? document.startViewTransition(fn).finished : (fn(), Promise.resolve());
    };
    // Kachel/Karte und deren Texte bekommen gleiche Namen -> Elemente morphen einzeln (Position/Größe) statt zu überblenden
    const name = (el, on) => {
      el.style.viewTransitionName = on ? 'node' : '';
      el.querySelectorAll('[data-vt]').forEach(e => e.style.viewTransitionName = on ? 'node-' + e.dataset.vt : '');
    };

    // URL der Detailansicht nach dem Scrollen nachziehen (kein neuer History-Eintrag)
    let urlTimer;
    const syncUrl = () => {
      clearTimeout(urlTimer);
      urlTimer = setTimeout(() => {
        if (detail.open) history.replaceState(null, '', `${BASE}${nodes[current().i].slug}#${col + 1}`);
      }, 150);
    };
    detail.addEventListener('scroll', syncUrl);

    // Detailansicht auf Node i / Detailkarte c stellen (ohne Animation)
    function show(i, c) {
      if (!detail.open) detail.showModal();
      detail.scrollTop = cards.children[i].offsetTop;
      for (const r of cards.children) r.scrollLeft = c * r.clientWidth;
      setDot(c);
    }

    function openAnim(i, c, animate) {
      if (!animate) return show(i, c);
      const tile = grid.children[i];
      let card;
      name(tile, true);
      transition('open', () => {
        name(tile, false);
        show(i, c);
        card = cards.children[i].children[c];
        name(card, true);
      }).then(() => name(card, false));
    }

    function closeAnim() {
      const { i, card } = current();
      const tile = grid.children[i];
      name(card, true);
      transition('close', () => {
        name(card, false);
        detail.close();
        tile.scrollIntoView({ block: 'nearest' });
        name(tile, true);
      }).then(() => name(tile, false));
    }

    // Routing: <BASE>node1#3 = Node 1, Detailkarte 3; <BASE> = Raster
    // BASE kommt aus <base href> (Root lokal, /font-collection/ auf GitHub Pages, siehe scripts/set-base.js)
    const BASE = new URL(document.baseURI).pathname;
    function route(animate = true) {
      const i = nodes.findIndex(n => n.slug === location.pathname.slice(BASE.length));
      const c = Math.min(Math.max((parseInt(location.hash.slice(1)) || 1) - 1, 0), DETAILS - 1);
      if (i >= 0) detail.open ? show(i, c) : openAnim(i, c, animate);
      else if (detail.open) closeAnim();
    }
    const go = url => { history.pushState(null, '', url); route(); };

    grid.addEventListener('click', e => {
      const tile = e.target.closest('[data-i]');
      if (tile) go(`${BASE}${nodes[tile.dataset.i].slug}#${col + 1}`);
    });
    document.getElementById('close').onclick = () => go(BASE);
    detail.addEventListener('cancel', e => { e.preventDefault(); go(BASE); }); // Esc
    addEventListener('popstate', () => route()); // Zurück/Vor und manuell geänderter Hash
    route(false); // direkter Aufruf einer URL
  </script>
</body>
</html>
